services:
  postgres:
    image: postgres:16-alpine
    container_name: serveit-postgres
    environment:
      POSTGRES_DB: serveit
      POSTGRES_USER: serveit
      POSTGRES_PASSWORD: serveit
    ports:
      - '5432:5432'
    volumes:
      - serveit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serveit -d serveit']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serveit_pg_data:
